# Wklejone do configuration.yaml → template: (jako osobny element listy)
# sensor.swiatlo_pora_dnia — docelowa jasność (%) + barwa (K) wg pory dnia
#   dzień (słońce ≥ 12°)       100%, 5000K
#   zmierzch/świt (-6°..12°)   płynnie między profilem wieczornym a dziennym
#   wieczór (do 21:00)          55%, 2700K
#   21:00 → 23:00               płynnie 55% → 10%, 2700K → 2000K
#   noc (23:00–05:00)           10%, 2000K
#   05:00 → 06:00               płynnie 10% → 55%
  - sensor:
      - name: "Światło pora dnia"
        unique_id: swiatlo_pora_dnia
        default_entity_id: sensor.swiatlo_pora_dnia
        icon: mdi:sun-clock
        unit_of_measurement: "%"
        state: >
          {% set e = state_attr('sun.sun','elevation') | float(0) %}
          {% set p = [0, [1, (e + 6) / 18] | min] | max %}
          {% set m = now().hour * 60 + now().minute %}
          {% set n = ([1, (m - 1260) / 120] | min) if m >= 1260 else (1 if m < 300 else ((1 - (m - 300) / 60) if m < 360 else 0)) %}
          {% set bb = 55 - 45 * n %}
          {{ (bb + (100 - bb) * p) | round(0) | int }}
        attributes:
          color_temp_kelvin: >
            {% set e = state_attr('sun.sun','elevation') | float(0) %}
            {% set p = [0, [1, (e + 6) / 18] | min] | max %}
            {% set m = now().hour * 60 + now().minute %}
            {% set n = ([1, (m - 1260) / 120] | min) if m >= 1260 else (1 if m < 300 else ((1 - (m - 300) / 60) if m < 360 else 0)) %}
            {% set bk = 2700 - 700 * n %}
            {{ (((bk + (5000 - bk) * p) / 50) | round(0) * 50) | int }}
          faza: >
            {% set e = state_attr('sun.sun','elevation') | float(0) %}
            {% set m = now().hour * 60 + now().minute %}
            {{ 'dzień' if e >= 12 else (('świt' if m < 720 else 'zmierzch') if e > -6 else
               ('noc' if (m >= 1380 or m < 300) else ('wyciszanie' if m >= 1260 else ('pobudka' if m < 360 else 'wieczór')))) }}
